name: CleanSend
options:
  bundleIdPrefix: io.github.4alvit
  deploymentTarget:
    iOS: '17.0'
  createIntermediateGroups: true
  developmentLanguage: en
fileGroups:
  - CleanSend.xctestplan
packages:
  SanitizerCore:
    path: .
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: 1
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
targets:
  CleanSend:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, CleanSend.entitlements, CleanSend.storekit]
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: RedactLeaf
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/CleanSend.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.4alvit.cleansend]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.4alvit.cleansend
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: SanitizerCore
      - package: SanitizerCore
        product: LocalizationSupport
      - target: CleanSendShare
        embed: true
  CleanSendTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EntitlementTests
      - path: Tests/WorkspaceTests
      - path: App/CleanSend.storekit
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.4alvit.cleansend.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: CleanSend
  CleanSendUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.4alvit.cleansend.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: CleanSend
    dependencies:
      - target: CleanSend
  CleanSendShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: [Info.plist, CleanSendShare.entitlements]
      - path: Shared
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: RedactLeaf
        CFBundleLocalizations: [en, ru]
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsFileWithMaxCount: 20
    entitlements:
      path: ShareExtension/CleanSendShare.entitlements
      properties:
        com.apple.security.application-groups: [group.io.github.4alvit.cleansend]
    dependencies:
      - package: SanitizerCore
        product: LocalizationSupport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.4alvit.cleansend.share
        TARGETED_DEVICE_FAMILY: '1,2'
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  CleanSend:
    build:
      targets:
        CleanSend: all
    run:
      config: Debug
      storeKitConfiguration: App/CleanSend.storekit
    test:
      config: Debug
      testPlans:
        - path: CleanSend.xctestplan
          defaultPlan: true
      targets:
        - name: CleanSendTests
          parallelizable: false
          randomExecutionOrder: false
        - name: CleanSendUITests
          parallelizable: false
          randomExecutionOrder: false
    archive:
      config: Release
