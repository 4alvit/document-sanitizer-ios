name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '47 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/security-scan.yml@ae771fd5815338336bbf5f887ad1c2f0e1203ee6 # main
    with:
      languages: python,actions
      run-codeql: true
      run-trivy: false
      run-dependency-review: false
  swift:
    name: Swift security analysis
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require reviewed ARM toolchain profile
        run: |
          test "$(uname -m)" = arm64
          test "$(xcodebuild -version)" = $'Xcode 16.4\nBuild version 16F6'
      - name: Initialize Swift analysis
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: swift
          build-mode: manual
      - name: Build the committed app and Share Extension for analysis
        run: >-
          xcodebuild -project CleanSend.xcodeproj -scheme CleanSend
          -configuration Debug -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath .codeql-derivedData CODE_SIGNING_ALLOWED=NO build
      - name: Analyze Swift
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:swift
